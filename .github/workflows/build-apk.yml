name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 检查是否已配置 Firebase（google-services.json）
        id: firebase_check
        run: |
          if [ -f "google-services.json" ]; then
            echo "根目录发现 google-services.json，本次构建将启用推送通知"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "未发现 google-services.json，本次构建将跳过推送通知（不会崩溃，只是功能关闭）"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建前端静态资源 (vite build -> dist)
        run: npm run build
        env:
          VITE_PUSH_ENABLED: ${{ steps.firebase_check.outputs.enabled }}

      - name: 安装 JDK 17（Android 构建需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 添加 / 同步 Capacitor Android 工程
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 接入 Firebase（仅当 google-services.json 存在时执行）
        if: steps.firebase_check.outputs.enabled == 'true'
        run: |
          cp google-services.json android/app/google-services.json
          # 项目级 build.gradle：给 buildscript 的 dependencies 加上 google-services 插件依赖
          if ! grep -q "com.google.gms:google-services" android/build.gradle; then
            sed -i "0,/dependencies {/s//dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle
          fi
          # 应用级 build.gradle：在文件末尾应用该插件
          if ! grep -q "apply plugin: 'com.google.gms.google-services'" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK（未签名，可直接安装测试）
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 如果是打 tag 触发，则创建 Release 并附带 APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
